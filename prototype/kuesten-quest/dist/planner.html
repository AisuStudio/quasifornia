<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planner</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb;--panel:#ffffff;--page:#f3f2ee;
  --text:#0b0b0b;--text2:#52514e;--muted:#7b7a74;
  --grid:#e3e2dd;--axis:#cfcec8;
  --s1:#2a78d6;--s2:#eb6834;--s3:#7a5bd0;
  --good:#0ca30c;--warn:#b57600;--crit:#d03b3b;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface:#1a1a19;--panel:#222221;--page:#141413;
    --text:#f0efec;--text2:#c3c2b7;--muted:#97968c;
    --grid:#34332f;--axis:#46453f;
    --s1:#3987e5;--s2:#d95926;--s3:#9a82e6;
    --good:#2bc02b;--warn:#fab219;--crit:#ec6a6a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19;--panel:#222221;--page:#141413;
  --text:#f0efec;--text2:#c3c2b7;--muted:#97968c;
  --grid:#34332f;--axis:#46453f;
  --s1:#3987e5;--s2:#d95926;--s3:#9a82e6;
  --good:#2bc02b;--warn:#fab219;--crit:#ec6a6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--grid);background:var(--panel)}
h1{font-size:18px;margin:0;line-height:1.2}
.tabs{display:flex;gap:4px}
.tabs a{color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:8px;border:1px solid transparent}
.tabs a:hover{border-color:var(--axis)}
.tabs a[aria-current="page"]{color:var(--text);background:var(--page);border-color:var(--axis);font-weight:600}
.tabs a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--axis);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--text2)}
button.danger{color:var(--crit)}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{border-color:var(--axis)}
#status{font-size:12px;color:var(--muted);min-width:90px}
#status.bad{color:var(--crit)}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--surface);cursor:grab;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
#stage.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.e{fill:none;stroke:var(--text2);stroke-width:2}
#edges path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#edges g.sel path.e{stroke:var(--s1);stroke-width:3}
#edges text{font-size:12px;fill:var(--text2);paint-order:stroke;stroke:var(--surface);stroke-width:4px;text-anchor:middle}
#edges path.tmp{fill:none;stroke:var(--s1);stroke-width:2;stroke-dasharray:6 4}
.node{position:absolute;width:190px;background:var(--panel);border:2px solid var(--axis);border-radius:10px;padding:8px 12px 10px;cursor:move;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.node.sel{border-color:var(--s1);box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 30%,transparent)}
.node .ty{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.node.scene .ty{color:var(--s1)}.node.branch .ty{color:var(--s2)}.node.note .ty{color:var(--s3)}
.node.note{background:color-mix(in srgb,var(--s3) 10%,var(--panel));border-style:dashed}
.node.branch{border-radius:22px}
.node.chapter{border-color:var(--s1);box-shadow:5px 5px 0 -1px var(--panel),5px 5px 0 0 var(--axis),10px 10px 0 -1px var(--panel),10px 10px 0 0 var(--axis)}
.node.chapter .ty{color:var(--s1)}
.node.chapter.sel{box-shadow:5px 5px 0 -1px var(--panel),5px 5px 0 0 var(--axis),10px 10px 0 -1px var(--panel),10px 10px 0 0 var(--axis),0 0 0 3px color-mix(in srgb,var(--s1) 30%,transparent)}
.node.mand{border-color:var(--warn);border-width:3px}
.node .bd{position:absolute;top:-10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--warn);color:#fff;padding:1px 7px;border-radius:9px}
.node .cnt{font-size:12px;color:var(--text2);margin-top:2px}
.node.dim,#eg g.dim{opacity:.22}
#crumbbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--grid);background:var(--panel);font-size:13px}
#crumbbar button{padding:2px 9px;border-radius:14px}
#crumbbar button[aria-current="true"]{font-weight:600;background:var(--page)}
#crumbbar .sep{color:var(--muted)}
#crumbbar .sp{margin-left:auto}
button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
#insp .chk{display:flex;gap:8px;align-items:center}
#insp .chk input{width:auto}
#insp .chk label{margin:0;font-size:14px;color:var(--text)}
.node .ti{font-weight:600;word-break:break-word}
.node .tx{font-size:12px;color:var(--text2);margin-top:2px;max-height:3.9em;overflow:hidden;word-break:break-word}
.node .h{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2px solid var(--axis);background:var(--panel);cursor:crosshair}
.node .h.o{right:-10px}.node .h.i{left:-10px;cursor:default}
.node .h.o:hover,.node.link-target .h.i{border-color:var(--s1);background:var(--s1)}
.node.link-target{border-color:var(--s1)}
#hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:80%}
#zoomctl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:2}
#insp{width:290px;border-left:1px solid var(--grid);background:var(--panel);padding:14px;display:none;flex-direction:column;gap:10px;overflow:auto}
#insp.on{display:flex}
#insp label{font-size:12px;color:var(--text2);display:block;margin-bottom:3px}
#insp input,#insp textarea,#insp select{width:100%}
#insp textarea{min-height:140px;resize:vertical}
#insp h2{font-size:14px;margin:0}
#warn{display:none;margin:0;padding:8px 16px;background:color-mix(in srgb,var(--crit) 15%,var(--panel));border-bottom:1px solid var(--crit);font-size:13px}
#warn.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){
  header{padding:8px 12px}.bar{margin-left:0;width:100%}
  main{flex-direction:column}
  #insp{width:100%;max-height:42%;border-left:0;border-top:1px solid var(--grid)}
  #insp textarea{min-height:80px}
}
</style>
</head>
<body>
<header>
  <h1>Planner</h1>
  <nav class="tabs" aria-label="Bereiche"><a href="/stats">Auswertung</a><a href="/planner" aria-current="page">Planner</a></nav>
  <div class="bar">
    <button id="undo" type="button" aria-label="Rückgängig (Strg+Z)" title="Rückgängig (Strg+Z)" disabled>↶</button><button id="redo" type="button" aria-label="Wiederholen (Strg+Umschalt+Z)" title="Wiederholen (Strg+Umschalt+Z)" disabled>↷</button>
    <button id="add-scene" type="button">+ Szene</button>
    <button id="add-branch" type="button">+ Verzweigung</button>
    <button id="add-note" type="button">+ Notiz</button>
    <button id="add-chapter" type="button">+ Kapitel</button>
    <button id="fit" type="button">Einpassen</button>
    <button id="export" type="button">Export</button>
    <button id="import" type="button">Import</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <span id="status" role="status" aria-live="polite">Lade …</span>
  </div>
</header>
<p id="warn" role="alert"><span id="warntxt"></span><button id="reload" type="button">Neu laden (lokale Änderungen verwerfen)</button></p>
<div id="crumbbar"><nav id="crumbs" aria-label="Ebene"></nav><button id="mand-filter" class="sp" type="button" aria-pressed="false" title="Nur Pflichtknoten hervorheben">Nur Pflicht</button></div>
<main>
  <div id="stage" tabindex="0" aria-label="Planungsfläche. Doppelklick legt eine Szene an. Entf löscht die Auswahl.">
    <div id="world"><svg id="edges" aria-hidden="true"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g id="eg" style="color:var(--text2)"></g><path class="tmp" id="tmp" hidden></path></svg><div id="nodes"></div></div>
    <p id="hint" hidden>Noch leer.<br>Doppelklick auf die Fläche legt eine Szene an. Am Punkt rechts eines Kastens ziehen, um zu verbinden.</p>
    <div id="zoomctl"><button id="zin" type="button" aria-label="Vergrößern">+</button><button id="zout" type="button" aria-label="Verkleinern">−</button></div>
  </div>
  <aside id="insp" aria-label="Eigenschaften"></aside>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s);
const stage=$('#stage'),world=$('#world'),nodesEl=$('#nodes'),eg=$('#eg'),tmp=$('#tmp'),insp=$('#insp'),status=$('#status'),hint=$('#hint');
const W=190,TYPES={scene:'Szene',branch:'Verzweigung',note:'Notiz',chapter:'Kapitel'};
const rid=()=>'n'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
let doc=null,rev=0,gid=null,sel=null,view={x:0,y:0,k:1},saving=false,pending=false,timer=0,stale=false,onlyMand=false;const views={};
const mk=(t,a={},tx)=>{const e=document.createElementNS(t==='svg'||t==='path'||t==='g'||t==='text'?'http://www.w3.org/2000/svg':'http://www.w3.org/1999/xhtml',t);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;return e};
const blank=()=>({v:1,root:'g0',title:'Spiel',graphs:{g0:{id:'g0',name:'Spiel',parent:null,nodes:{},edges:[]}}});
const G=()=>doc.graphs[gid];
/* ---------- Speichern ---------- */
function setStatus(t,bad){status.textContent=t;status.className=bad?'bad':''}
function backup(){try{localStorage.setItem('planner-backup',JSON.stringify({t:Date.now(),doc}))}catch(e){}}
/* Rückgängig: Schnappschüsse des ganzen Dokuments. changed() vergleicht mit dem letzten Stand, so muss keine Aktion etwas davon wissen.
   Tippen in einem Feld zählt als ein Schritt, solange man nicht länger als 1,5 s pausiert. */
let last='',undo=[],redo=[],undoSize=0,lastKey='',lastT=0;
function histBtns(){$('#undo').disabled=!undo.length;$('#redo').disabled=!redo.length}
function sched(){backup();setStatus('Ungespeichert …');clearTimeout(timer);timer=setTimeout(save,800)}
function changed(){
  const cur=JSON.stringify(doc);
  if(cur!==last){
    const ae=document.activeElement,typing=!!ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&/^f-/.test(ae.id),key=typing?ae.id+'|'+(sel?sel.id:''):'',now=Date.now();
    if(!(typing&&key===lastKey&&now-lastT<1500)){undo.push(last);undoSize+=last.length;while(undo.length>100||undoSize>3e7)undoSize-=undo.shift().length}
    lastKey=key;lastT=now;last=cur;redo=[];histBtns()}
  sched()}
function restore(snap){doc=JSON.parse(snap);if(!doc.graphs[gid])gid=doc.root;sel=null;for(const k in views)if(!doc.graphs[k])delete views[k];render();inspect();last=snap;lastKey='';histBtns();sched()}
function doUndo(){if(!undo.length)return;const x=undo.pop();undoSize-=x.length;redo.push(last);restore(x)}
function doRedo(){if(!redo.length)return;const x=redo.pop();undo.push(last);undoSize+=last.length;restore(x)}
async function save(){
  if(stale)return;if(saving){pending=true;return}
  saving=true;pending=false;setStatus('Speichert …');
  try{
    const r=await fetch('/api/planner',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({rev,doc})});
    if(r.status===409){stale=true;warn('Anderswo wurde neuer gespeichert. Dein Stand ist veraltet und wird nicht mehr gespeichert.');setStatus('Veraltet',true)}
    else if(!r.ok){setStatus('Fehler '+r.status,true);pending=false}
    else{const j=await r.json();rev=j.rev;setStatus(pending?'Ungespeichert …':'Gespeichert')}
  }catch(e){setStatus('Offline – nur lokal gesichert',true)}
  saving=false;if(pending&&!stale)save()}
function warn(t){$('#warntxt').textContent=t;$('#warn').classList.add('on')}
$('#reload').onclick=()=>{try{localStorage.removeItem('planner-backup')}catch(e){}location.reload()};
/* ---------- Ansicht ---------- */
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;stage.style.backgroundSize=`${24*view.k}px ${24*view.k}px`;stage.style.backgroundPosition=`${view.x}px ${view.y}px`}
function toWorld(cx,cy){const r=stage.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}
function zoomAt(cx,cy,f){const r=stage.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,k=Math.max(.2,Math.min(2,view.k*f)),q=k/view.k;view.x=px-(px-view.x)*q;view.y=py-(py-view.y)*q;view.k=k;applyView()}
function fit(){const ns=Object.values(G().nodes);if(!ns.length){view={x:60,y:60,k:1};applyView();return}
  const el=id=>nodesEl.querySelector(`[data-id="${id}"]`);let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const n of ns){const h=(el(n.id)||{offsetHeight:70}).offsetHeight;a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+W);d=Math.max(d,n.y+h)}
  const r=stage.getBoundingClientRect(),pad=50,k=Math.max(.2,Math.min(1,Math.min((r.width-2*pad)/(c-a),(r.height-2*pad)/(d-b))));
  view={k,x:(r.width-(c-a)*k)/2-a*k,y:(r.height-(d-b)*k)/2-b*k};applyView()}
/* ---------- Kapitel ---------- */
function hasMand(id,seen=new Set()){if(seen.has(id)||!doc.graphs[id])return false;seen.add(id);return Object.values(doc.graphs[id].nodes).some(n=>n.mandatory||(n.type==='chapter'&&n.graph&&hasMand(n.graph,seen)))}
function isMand(n){return !!n.mandatory||(n.type==='chapter'&&!!n.graph&&hasMand(n.graph))}
function descendants(id,seen=new Set()){if(seen.has(id)||!doc.graphs[id])return seen;seen.add(id);for(const n of Object.values(doc.graphs[id].nodes))if(n.type==='chapter'&&n.graph)descendants(n.graph,seen);return seen}
function crumbs(){const c=$('#crumbs');c.textContent='';const chain=[];let id=gid,guard=0;while(id&&doc.graphs[id]&&guard++<50){chain.unshift(id);id=doc.graphs[id].parent}
  if(chain[0]!==doc.root)chain.unshift(doc.root);
  chain.forEach((id,i)=>{if(i)c.append(mk('span',{class:'sep','aria-hidden':'true'},' › '));const last=i===chain.length-1,b=mk('button',{type:'button','data-go':id},(id===doc.root?(doc.title||doc.graphs[id].name):doc.graphs[id].name)||'(ohne Titel)');if(last)b.setAttribute('aria-current','true');b.onclick=()=>goTo(id);c.append(b)})}
function goTo(id){if(!doc.graphs[id]||id===gid)return;views[gid]={...view};gid=id;sel=null;render();inspect();if(views[id]){view={...views[id]};applyView()}else fit()}
function openChapter(nid){const n=G().nodes[nid];if(!n||n.type!=='chapter')return;
  if(!n.graph||!doc.graphs[n.graph]){const id=rid();doc.graphs[id]={id,name:n.title,parent:gid,nodes:{},edges:[]};n.graph=id;changed()}
  goTo(n.graph)}
/* ---------- Zeichnen ---------- */
function nodeEl(n){
  const e=mk('div',{class:'node '+n.type+(sel&&sel.kind==='node'&&sel.id===n.id?' sel':''),'data-id':n.id,tabindex:'-1'});
  e.style.left=n.x+'px';e.style.top=n.y+'px';
  if(n.mandatory){e.classList.add('mand');e.append(mk('span',{class:'bd'},'Pflicht'))}
  if(onlyMand&&!isMand(n))e.classList.add('dim');
  e.append(mk('div',{class:'ty'},TYPES[n.type]||n.type),mk('div',{class:'ti'},n.title||'(ohne Titel)'));
  if(n.type==='chapter'){const cg=n.graph&&doc.graphs[n.graph],ns=cg?Object.values(cg.nodes):[];e.append(mk('div',{class:'cnt'},ns.length+' Knoten'+(ns.some(x=>x.mandatory)||(cg&&hasMand(n.graph))?' · mit Pflicht':'')))}
  if(n.text)e.append(mk('div',{class:'tx'},n.text));
  e.append(mk('span',{class:'h i'}),mk('span',{class:'h o','data-out':'1',title:'Ziehen zum Verbinden'}));
  return e}
function render(){
  nodesEl.textContent='';for(const n of Object.values(G().nodes))nodesEl.append(nodeEl(n));
  hint.hidden=Object.keys(G().nodes).length>0;renderEdges();crumbs()}
function renderNode(id){const old=nodesEl.querySelector(`[data-id="${id}"]`),n=G().nodes[id];if(old&&n)old.replaceWith(nodeEl(n));renderEdges()}
function box(id){const e=nodesEl.querySelector(`[data-id="${id}"]`),n=G().nodes[id];return {x:n.x,y:n.y,h:e?e.offsetHeight:70}}
function path(a,b){const x1=a.x+W,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=Math.max(50,Math.abs(x2-x1)/2);return `M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}
function renderEdges(){
  eg.textContent='';
  for(const ed of G().edges){const A=G().nodes[ed.from],B=G().nodes[ed.to];if(!A||!B)continue;
    const a=box(ed.from),b=box(ed.to),d=path(a,b),dim=onlyMand&&!(isMand(A)&&isMand(B)),g=mk('g',{'data-edge':ed.id,class:(sel&&sel.kind==='edge'&&sel.id===ed.id?'sel':'')+(dim?' dim':'')});
    g.append(mk('path',{class:'e',d,'marker-end':'url(#arr)'}),mk('path',{class:'hit',d}));
    if(ed.label){g.append(mk('text',{x:(a.x+W+b.x)/2,y:(a.y+a.h/2+b.y+b.h/2)/2-6},ed.label))}
    eg.append(g)}}
/* ---------- Auswahl und Eigenschaften ---------- */
function select(s){sel=s;render();inspect()}
function field(lbl,el){const w=mk('div');const l=mk('label',{},lbl);w.append(l,el);return w}
function inspect(){
  insp.textContent='';insp.classList.toggle('on',!!sel);if(!sel)return;
  if(sel.kind==='node'){const n=G().nodes[sel.id];if(!n){sel=null;insp.classList.remove('on');return}
    const ti=mk('input',{type:'text',maxlength:'120',id:'f-title'});ti.value=n.title;
    const tx=mk('textarea',{maxlength:'4000',id:'f-text'});tx.value=n.text;
    ti.oninput=()=>{n.title=ti.value;if(n.type==='chapter'&&n.graph&&doc.graphs[n.graph])doc.graphs[n.graph].name=n.title;renderNode(n.id);crumbs();changed()};
    tx.oninput=()=>{n.text=tx.value;renderNode(n.id);changed()};
    const mc=mk('input',{type:'checkbox',id:'f-mand'});mc.checked=!!n.mandatory;
    mc.onchange=()=>{n.mandatory=mc.checked;renderNode(n.id);if(onlyMand)render();changed()};
    const mw=mk('div',{class:'chk'});mw.append(mc,mk('label',{for:'f-mand'},'Pflicht (Spieler muss hier durch)'));
    const del=mk('button',{type:'button',class:'danger',id:'f-del'},n.type==='chapter'?'Kapitel löschen':'Knoten löschen');del.onclick=()=>removeSel();
    insp.append(mk('h2',{},n.type==='chapter'?'Kapitel':'Knoten'),field('Titel',ti));
    if(n.type==='chapter'){const op=mk('button',{type:'button',id:'f-open'},'Kapitel öffnen');op.onclick=()=>openChapter(n.id);insp.append(op)}
    else{const ty=mk('select',{id:'f-type'});for(const k of ['scene','branch','note'])ty.append(mk('option',{value:k},TYPES[k]));ty.value=n.type;ty.onchange=()=>{n.type=ty.value;renderNode(n.id);changed()};insp.append(field('Art',ty))}
    insp.append(mw,field('Text / Notizen',tx),del)}
  else{const ed=G().edges.find(e=>e.id===sel.id);if(!ed){sel=null;insp.classList.remove('on');return}
    const lb=mk('input',{type:'text',maxlength:'60',id:'f-label',placeholder:'z. B. ja / nein'});lb.value=ed.label;
    lb.oninput=()=>{ed.label=lb.value;renderEdges();changed()};
    const del=mk('button',{type:'button',class:'danger',id:'f-del'},'Verbindung löschen');del.onclick=()=>removeSel();
    insp.append(mk('h2',{},'Verbindung'),field('Beschriftung',lb),del)}}
function removeSel(){
  if(!sel)return;const g=G();
  if(sel.kind==='node'){const n=g.nodes[sel.id];
    if(n&&n.type==='chapter'&&n.graph&&doc.graphs[n.graph]){const ids=descendants(n.graph),cnt=[...ids].reduce((a,i)=>a+Object.keys(doc.graphs[i].nodes).length,0);
      if(cnt&&!confirm('Das Kapitel enthält '+cnt+' Knoten (mit Unterkapiteln). Alles löschen?'))return;
      ids.forEach(i=>{delete doc.graphs[i];delete views[i]})}
    delete g.nodes[sel.id];g.edges=g.edges.filter(e=>e.from!==sel.id&&e.to!==sel.id)}
  else g.edges=g.edges.filter(e=>e.id!==sel.id);
  sel=null;render();inspect();changed()}
function addNode(type,x,y){
  if(x==null){const r=stage.getBoundingClientRect(),p=toWorld(r.left+r.width/2,r.top+r.height/2);x=p.x-W/2;y=p.y-30;const ns=Object.values(G().nodes);for(let i=0;i<40&&ns.some(n=>Math.abs(n.x-x)<W&&Math.abs(n.y-y)<90);i++){x+=40;y+=50}}
  const n={id:rid(),type,title:TYPES[type],text:'',x:Math.round(x),y:Math.round(y),mandatory:false};
  if(type==='chapter'){const id=rid();doc.graphs[id]={id,name:n.title,parent:gid,nodes:{},edges:[]};n.graph=id}
  G().nodes[n.id]=n;select({kind:'node',id:n.id});changed();
  const t=$('#f-title');if(t&&matchMedia('(pointer:fine)').matches){t.focus();t.select()}}
function addEdge(from,to){
  if(from===to||!G().nodes[from]||!G().nodes[to])return;
  if(G().edges.some(e=>e.from===from&&e.to===to))return;
  const ed={id:rid(),from,to,label:''};G().edges.push(ed);select({kind:'edge',id:ed.id});changed()}
/* ---------- Bedienung (Zeiger) ---------- */
const ptrs=new Map();let drag=null,pinch=null;
stage.addEventListener('pointerdown',ev=>{
  if(ev.button>0)return;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return}
  const out=ev.target.closest('.h.o'),nd=ev.target.closest('.node'),hit=ev.target.closest('[data-edge]');
  if(out&&nd){const id=nd.dataset.id;drag={kind:'link',from:id,pid:ev.pointerId};tmp.removeAttribute('hidden');ev.preventDefault();return}
  if(nd){const id=nd.dataset.id,n=G().nodes[id];if(!(sel&&sel.kind==='node'&&sel.id===id))select({kind:'node',id});
    drag={kind:'node',id,sx:ev.clientX,sy:ev.clientY,ox:n.x,oy:n.y,moved:false,pid:ev.pointerId};ev.preventDefault();return}
  if(hit){select({kind:'edge',id:hit.dataset.edge});return}
  drag={kind:'pan',sx:ev.clientX,sy:ev.clientY,ox:view.x,oy:view.y,moved:false,pid:ev.pointerId};stage.classList.add('pan')});
window.addEventListener('pointermove',ev=>{
  if(ptrs.has(ev.pointerId))ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch.d>0)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch.d);pinch.d=d;return}
  if(!drag||drag.pid!==ev.pointerId)return;
  if(drag.kind==='pan'){const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.x=drag.ox+dx;view.y=drag.oy+dy;applyView()}
  else if(drag.kind==='node'){const n=G().nodes[drag.id],dx=(ev.clientX-drag.sx)/view.k,dy=(ev.clientY-drag.sy)/view.k;
    if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;n.x=Math.round(drag.ox+dx);n.y=Math.round(drag.oy+dy);
    const e=nodesEl.querySelector(`[data-id="${drag.id}"]`);if(e){e.style.left=n.x+'px';e.style.top=n.y+'px'}renderEdges()}
  else if(drag.kind==='link'){const a=box(drag.from),p=toWorld(ev.clientX,ev.clientY);
    tmp.setAttribute('d',path(a,{x:p.x,y:p.y-0,h:0}));
    const t=document.elementFromPoint(ev.clientX,ev.clientY),nd=t&&t.closest&&t.closest('.node');
    nodesEl.querySelectorAll('.link-target').forEach(e=>e.classList.remove('link-target'));
    if(nd&&nd.dataset.id!==drag.from)nd.classList.add('link-target')}});
function endPtr(ev){
  ptrs.delete(ev.pointerId);if(ptrs.size<2)pinch=null;
  if(!drag||drag.pid!==ev.pointerId)return;
  if(drag.kind==='node'&&drag.moved)changed();
  if(drag.kind==='pan'){stage.classList.remove('pan');if(!drag.moved&&ev.type==='pointerup'&&sel){select(null)}}
  if(drag.kind==='link'){tmp.setAttribute('hidden','');tmp.removeAttribute('d');nodesEl.querySelectorAll('.link-target').forEach(e=>e.classList.remove('link-target'));
    if(ev.type==='pointerup'){const t=document.elementFromPoint(ev.clientX,ev.clientY),nd=t&&t.closest&&t.closest('.node');if(nd)addEdge(drag.from,nd.dataset.id)}}
  drag=null}
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*(ev.ctrlKey?.01:.0015)))},{passive:false});
stage.addEventListener('dblclick',ev=>{const cn=ev.target.closest('.node');if(cn&&cn.classList.contains('chapter')){openChapter(cn.dataset.id);return}if(ev.target.closest('.node')||ev.target.closest('[data-edge]')||ev.target.closest('#zoomctl'))return;const p=toWorld(ev.clientX,ev.clientY);addNode('scene',p.x-W/2,p.y-24)});
window.addEventListener('keydown',ev=>{
  if((ev.ctrlKey||ev.metaKey)&&!ev.altKey){const k=ev.key.toLowerCase();if(k==='z'){ev.preventDefault();ev.shiftKey?doRedo():doUndo();return}if(k==='y'){ev.preventDefault();doRedo();return}}
  const t=ev.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if((ev.key==='Delete'||ev.key==='Backspace')&&sel){ev.preventDefault();removeSel()}
  else if(ev.key==='Escape'&&sel)select(null)});
$('#add-scene').onclick=()=>addNode('scene');$('#add-branch').onclick=()=>addNode('branch');$('#add-note').onclick=()=>addNode('note');$('#add-chapter').onclick=()=>addNode('chapter');
$('#mand-filter').onclick=()=>{onlyMand=!onlyMand;$('#mand-filter').setAttribute('aria-pressed',String(onlyMand));render()};
$('#fit').onclick=fit;$('#undo').onclick=doUndo;$('#redo').onclick=doRedo;
$('#zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)};
$('#zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.8)};
/* ---------- Export und Import ---------- */
$('#export').onclick=()=>{const b=new Blob([JSON.stringify(doc,null,1)],{type:'application/json'}),a=mk('a',{href:URL.createObjectURL(b),download:'planner-'+new Date().toISOString().slice(0,10)+'.json'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#import').onclick=()=>$('#file').click();
$('#file').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch(e){alert('Keine gültige JSON-Datei.');return}
  if(!d||d.v!==1||!d.graphs||!d.graphs[d.root]){alert('Das ist kein Planner-Dokument.');return}
  if(!confirm('Importieren ersetzt das aktuelle Dokument. Fortfahren?'))return;
  doc=d;gid=doc.root;sel=null;for(const k in views)delete views[k];render();inspect();fit();changed()};
/* ---------- Start ---------- */
async function init(){
  let j=null;
  try{const r=await fetch('/api/planner',{cache:'no-store'});if(!r.ok)throw new Error(r.status);j=await r.json()}
  catch(e){setStatus('Server nicht erreichbar',true);let bk=null;try{bk=JSON.parse(localStorage.getItem('planner-backup')||'null')}catch(_){}
    doc=bk&&bk.doc?bk.doc:blank();stale=true;warn('Der Server ist nicht erreichbar. Es wird nicht gespeichert.')}
  if(j){rev=j.rev;doc=j.doc||blank();setStatus(j.doc?'Gespeichert':'Neu')}
  gid=doc.root;render();fit();inspect();last=JSON.stringify(doc);histBtns();
  window.__planner={doc:()=>doc,rev:()=>rev,view:()=>view,sel:()=>sel,gid:()=>gid,undoDepth:()=>undo.length,redoDepth:()=>redo.length,save}}
init();
window.addEventListener('resize',()=>renderEdges());
})();
</script>
</body>
