<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designer (intern, Prototyp)</title>
<!-- Designer-Rahmen: Reiter für die Arten von Dingen, die später hier entworfen werden. Fokus ist der Avatar. Die anderen Reiter sind Platzhalter ("bald").
     Jeder Reiter ist eine eigene Seite im Rahmen (iframe), damit sich die Teile unabhängig weiterentwickeln lassen. Der Rahmen ändert nichts am Spiel. -->
<style>
@font-face{font-family:"Smarta Nova";src:url(fonts/smarta-nova.otf)}
:root{--bg:#1a1626;--pn:#241e36;--ln:#3a3256;--tx:#fdf6e8;--mu:#b9b0d0;--ac:#ff7ab8;--tl:#5ee0d0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Smarta Nova","Trebuchet MS",sans-serif}
body{display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--pn);border-bottom:2px solid var(--ln);flex-wrap:wrap}
#top b{font-weight:400;font-size:18px;margin-right:10px}
[role=tab]{font:inherit;color:var(--tx);background:#2f2748;border:2px solid var(--ln);border-radius:8px 8px 0 0;padding:5px 12px;cursor:pointer}
[role=tab][aria-selected=true]{background:var(--ac);color:#1a1626;border-color:var(--ac)}
[role=tab].soon{color:var(--mu)}
[role=tab]:focus-visible,#sub button:focus-visible{outline:3px solid var(--tl);outline-offset:1px}
#sub{display:flex;gap:6px;padding:6px 12px;background:#1f1a30;border-bottom:2px solid var(--ln)}
#sub button{font:inherit;color:var(--tx);background:#2f2748;border:2px solid var(--ln);border-radius:8px;padding:2px 10px;cursor:pointer}
#sub button.on{background:var(--tl);color:#1a1626;border-color:var(--tl)}
main{flex:1;min-height:0}iframe{width:100%;height:100%;border:0;display:none}iframe.on{display:block}
.soon-card{max-width:640px;margin:48px auto;padding:24px;background:var(--pn);border:2px solid var(--ln);border-radius:14px}
.soon-card h1{font-weight:400;font-size:26px;margin:0 0 8px}.soon-card p{color:var(--mu);margin:6px 0}.tag{display:inline-block;background:var(--ac);color:#1a1626;border-radius:999px;padding:1px 12px;font-size:13px;margin-bottom:10px}
#soon{display:none;overflow:auto;height:100%}#soon.on{display:block}
</style></head><body>
<div id="top"><b>Designer</b><div role="tablist" aria-label="Art" id="tabs"></div></div>
<div id="sub" role="group" aria-label="Avatar-Modus"><button id="s-round" class="on">Rund (Avatare des Spiels)</button><button id="s-mesh">Mesh (Low Poly)</button><button id="s-pixel">Pixel-Netz (Experiment)</button></div>
<main><iframe id="f-round" class="on" src="round.html" title="Avatar, rund"></iframe><iframe id="f-mesh" src="mesh.html" title="Avatar, Mesh"></iframe><iframe id="f-pixel" src="pixel.html" title="Avatar, Pixel-Netz"></iframe><iframe id="f-haus" src="haus.html" title="Gebäude" data-lazy="1"></iframe><div id="soon"></div></main>
<script>
const TABS=[
 {id:'avatar',t:'Avatar'},
 {id:'mobs',t:'Mobs und Tiere',soon:['Mobs und Tiere','Figuren mit anderem Skelett als der Mensch: Hunde, Vögel, Insekten, Echsen. Gleiche Anker und gleiche Regler wie beim Avatar, eigene Teile-Sätze und Animationen.']},
 {id:'props',t:'Props und Werkzeuge',soon:['Props und Werkzeuge','Dinge zum Tragen und Benutzen: Skateboards, Sprühdosen, Rucksäcke, Werkzeuge. Feste Teile mit Gelenken, ohne Skelett.']},
 {id:'fahr',t:'Fahrzeuge',soon:['Fahrzeuge','Autos, Boards, Busse: feste Teile mit Rädern und Klappen, Farbzonen, Aufkleber.']},
 {id:'bau',t:'Gebäude'},
 {id:'land',t:'Landschaften',soon:['Landschaften','Höhenkarten und Flächenmalerei sind ein eigenes Werkzeug und kommen vermutlich nicht in dieses Fenster. Der Reiter hält den Platz frei.']}];
const tabs=document.getElementById('tabs');let cur='avatar';
function show(id){cur=id;[...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));const av=id==='avatar';document.getElementById('sub').style.display=av?'flex':'none';
  const sm=document.getElementById('soon');const hs=document.getElementById('f-haus');hs.classList.toggle('on',id==='bau');
  if(av){sm.className='';sm.innerHTML='';sub(subMode)}else if(id==='bau'){['f-round','f-pixel','f-mesh'].forEach(f=>document.getElementById(f).classList.remove('on'));sm.className='';sm.innerHTML=''}else{const T=TABS.find(x=>x.id===id);['f-round','f-pixel','f-mesh'].forEach(f=>document.getElementById(f).classList.remove('on'));sm.className='on';sm.innerHTML='';
    const c=document.createElement('div');c.className='soon-card';const tg=document.createElement('span');tg.className='tag';tg.textContent='bald';const h=document.createElement('h1');h.textContent=T.soon[0];const p=document.createElement('p');p.textContent=T.soon[1];c.append(tg,h,p);sm.appendChild(c)}}
let subMode='round';
function sub(m){subMode=m;['round','mesh','pixel'].forEach(k=>{document.getElementById('f-'+k).classList.toggle('on',m===k);document.getElementById('s-'+k).classList.toggle('on',m===k)})}
TABS.forEach(T=>{const b=document.createElement('button');b.setAttribute('role','tab');b.dataset.id=T.id;b.textContent=T.t+(T.soon?' · bald':'');if(T.soon)b.className='soon';b.onclick=()=>show(T.id);tabs.appendChild(b)});
document.getElementById('s-round').onclick=()=>sub('round');document.getElementById('s-mesh').onclick=()=>sub('mesh');document.getElementById('s-pixel').onclick=()=>sub('pixel');
show('avatar');
</script></body></html>
