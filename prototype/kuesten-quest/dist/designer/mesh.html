<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designer: Mesh-Avatar</title>
<!-- Mesh-Avatar (Low Poly) mit Texture-Painter. Eine Figur aus einem Stück (rund 250 Vierecke), per Code erzeugt, an denselben Gelenken wie die Avatare im Spiel
     (hips, torso, head, thigh, shin, foot, shoulder, elbow) mit weichem Übergang (Skinning). Die Textur ist ein Feld 64 x 64 aus Palettennummern (kein Bild-Upload),
     gemalt direkt auf dem Modell oder auf der abgewickelten Fläche. Dargestellt ohne Glättung. Nicht mit dem Spiel verbunden. Format: AvatarMesh v1 (siehe README). -->
<style>
@font-face{font-family:"Smarta Nova";src:url(fonts/smarta-nova.otf)}
:root{--bg:#1a1626;--pn:#241e36;--ln:#3a3256;--tx:#fdf6e8;--mu:#b9b0d0;--ac:#ff7ab8;--tl:#5ee0d0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.35 "Smarta Nova","Trebuchet MS",sans-serif}
#app{display:grid;grid-template-columns:minmax(320px,1fr) 420px;height:100%}
#view{position:relative;min-width:0}#view canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:14px;bottom:12px;color:var(--mu);font-size:13px;pointer-events:none}
#side{overflow:auto;padding:12px 14px;background:var(--pn);border-left:2px solid var(--ln)}
h1{font-size:21px;margin:0 0 2px;font-weight:400}h2{font-size:13px;margin:12px 0 4px;font-weight:400;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--mu);font-size:12px;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0}
button,select,input[type=text],textarea{font:inherit;color:var(--tx);background:#2f2748;border:2px solid var(--ln);border-radius:8px;padding:3px 9px}
button{cursor:pointer}button[aria-pressed=true]{background:var(--ac);color:#1a1626;border-color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:3px solid var(--tl);outline-offset:1px}
#pal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}#pal button{height:26px;padding:0;border-radius:6px}#pal button[aria-pressed=true]{outline:3px solid var(--tx);outline-offset:1px}
#atlasbox{position:relative;width:384px;max-width:100%;aspect-ratio:1}
#atlas,#ov{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;border:2px solid var(--ln);border-radius:6px;touch-action:none}
#atlas{cursor:crosshair;background:#12101c}#ov{pointer-events:none}
textarea{width:100%;height:64px;font:11px/1.2 monospace;resize:vertical}
#msg{min-height:18px;color:var(--ac);font-size:13px}.chk{display:inline-flex;gap:5px;align-items:center;margin-right:10px}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr}}
</style></head><body>
<div id="app"><div id="view"><div id="hint">Auf der Figur ziehen: malen · daneben oder rechte Maustaste ziehen: drehen · Mausrad: Abstand</div></div>
<div id="side">
<h1>Mesh-Avatar</h1><p class="sub">Intern · Low Poly aus einem Stück · Format AvatarMesh v1 · nicht mit dem Spiel verbunden</p>
<h2>Malen</h2>
<div class="row" id="tools"></div>
<div id="pal" role="group" aria-label="Palette"></div>
<div class="row"><label class="chk"><input type="checkbox" id="mir" checked> Spiegeln (links/rechts)</label><button id="undo" type="button">Zurück</button><button id="reset" type="button">Neu</button></div>
<h2>Abgewickelte Fläche (64 × 64)</h2>
<div id="atlasbox"><canvas id="atlas" width="64" height="64" tabindex="0" aria-label="Textur, 64 mal 64 Pixel"></canvas><canvas id="ov" width="384" height="384" aria-hidden="true"></canvas></div>
<h2>Ansicht</h2>
<div class="row"><select id="pose" aria-label="Pose"><option value="stand">Stehen</option><option value="walk">Gehen (Vorschau)</option><option value="skate">Skaten</option></select>
<label class="chk"><input type="checkbox" id="wire"> Netz zeigen</label><label class="chk"><input type="checkbox" id="smooth"> Geglättet</label></div>
<h2>Auf dem Server (mit Versionen)</h2><div id="srv"></div>
<h2>Datensatz</h2><div class="row"><button id="export" type="button">JSON anzeigen</button><button id="import" type="button">JSON übernehmen</button></div>
<textarea id="json" aria-label="Datensatz als JSON" spellcheck="false"></textarea><div id="msg" role="status"></div>
<p class="sub" id="stat"></p>
</div></div>
<script src="srv.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
/* ---------- Palette (Platzhalter: die 12 Farben des Haus-Builders, bis die Palette des Spiels feststeht) ---------- */
const PAL=['#f1a7c8','#a9e6d2','#f6df73','#a9d8f0','#f6c3a8','#e7b8e8','#eae8e8','#47c2a5','#d54291','#2a3a6a','#e5383b','#8a5a3c'];
const TX=64,CH='0123456789ab';

const RID={head:1,torso:2,cap:3,armL:4,armR:5,legL:6,legR:7,footL:8,footR:9};
const PAIR={armL:'armR',armR:'armL',legL:'legR',legR:'legL',footL:'footR',footR:'footL'},SELF={head:1,torso:1};
const reg=new Uint8Array(TX*TX);for(const k in RECT){const [x,y,w,h]=RECT[k];for(let j=0;j<h;j++)for(let i=0;i<w;i++)reg[(y+j)*TX+x+i]=RID[k]}

const thigh=[],shin=[],foot=[],shoulder=[],elbow=[];
[-1,1].forEach(s=>{const t=mkB('thigh'+(s<0?'L':'R'),hips,s*.11,.9,0),sh=mkB('shin'+(s<0?'L':'R'),t,0,-.45,0),f=mkB('foot'+(s<0?'L':'R'),sh,0,-.46,0);thigh.push(t);shin.push(sh);foot.push(f)});
[-1,1].forEach(s=>{const a=mkB('shoulder'+(s<0?'L':'R'),torso,s*.22,.55,0),e=mkB('elbow'+(s<0?'L':'R'),a,0,-.33,0);shoulder.push(a);elbow.push(e)});

const bi=(k,s)=>({H:'hips',Q:'torso',D:'head'}[k]||({T:'thigh',S:'shin',F:'foot',A:'shoulder',E:'elbow'}[k]+(s<0?'L':'R')));

function tube(d){
  const N=d.N,R=d.rings.length,[rx0,ry0,rw,rh]=d.rect,base=P.length/3,s=d.side||0,ph=d.phase||0,e=.02;
  for(let j=0;j<R;j++){const r=d.rings[j];
    for(let i=0;i<=N;i++){const th=Math.PI+2*Math.PI*i/N+ph,sn=Math.sin(th),cs=Math.cos(th);
      P.push(r.c[0]+r.ax[0]*r.rx*sn+r.az[0]*r.rz*cs,r.c[1]+r.ax[1]*r.rx*sn+r.az[1]*r.rz*cs,r.c[2]+r.ax[2]*r.rx*sn+r.az[2]*r.rz*cs);
      UV.push((rx0+e+(rw-2*e)*i/N)/TX,1-(ry0+e+(rh-2*e)*j/(R-1))/TX);
      const bs=r.b.map(([k,w])=>[IDX[bi(k,s)],w]);while(bs.length<4)bs.push([0,0]);bs.forEach(([a,w])=>{SI.push(a);SW.push(w)})}}

    P.push(...r.c);UV.push(u,vv);const bs=r.b.map(([k,w])=>[IDX[bi(k,s)],w]);while(bs.length<4)bs.push([0,0]);bs.forEach(([a,w])=>{SI.push(a);SW.push(w)});

  tube({N:4,phase:Math.PI/4,rect:RECT[s<0?'footL':'footR'],side:s,rings:[f(-.12,.06,.075,.06),f(.12,.06,.085,.06),f(.3,.045,.07,.04)],caps:[{ring:0,dir:[0,0,-1]},{ring:2,dir:[0,0,1]}]})});
/* Arme (hängen im Ruhezustand nach unten) */
[-1,1].forEach(s=>{const ax=s<0?X:[-1,0,0];
  tube({N:6,rect:RECT[s<0?'armL':'armR'],side:s,rings:[{y:1.65,r:.075,b:[['A',.6],['Q',.4]]},{y:1.52,r:.066,b:[['A',1]]},{y:1.305,r:.054,b:[['A',.5],['E',.5]]},{y:1.15,r:.05,b:[['E',1]]},{y:.99,r:.044,b:[['E',1]]},{y:.93,r:.05,b:[['E',1]]},{y:.84,r:.032,b:[['E',1]]}].map(q=>({c:[s*.235,q.y,0],ax,az:Z,rx:q.r,rz:q.r,b:q.b})),caps:[{ring:6,dir:[0,-1,0]}]})});
/* Rumpf mit Becken und Hals */
tube({N:8,rect:RECT.torso,rings:[{y:.97,rx:.15,rz:.11,b:[['H',1]]},{y:1.06,rx:.2,rz:.14,b:[['H',1]]},{y:1.2,rx:.17,rz:.12,b:[['H',.5],['Q',.5]]},{y:1.4,rx:.19,rz:.13,b:[['Q',1]]},{y:1.62,rx:.2,rz:.12,b:[['Q',1]]},{y:1.8,rx:.06,rz:.06,b:[['Q',.5],['D',.5]]}].map(q=>({c:[0,q.y,0],ax:X,az:Z,rx:q.rx,rz:q.rz,b:q.b})),caps:[{ring:0,dir:[0,-1,0]}]});

tube({N:8,rect:RECT.head,rings:[90,60,30,0,-30,-60,-90].map(a=>{const r=a*Math.PI/180;return {c:[0,1.945+.132*Math.sin(r),.04],ax:X,az:Z,rx:.112*Math.cos(r),rz:.122*Math.cos(r),b:[['D',1]]}})});
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(UV,2));
geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(SI,4));geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(SW,4));geo.setIndex(IX);geo.computeVertexNormals();
/* ---------- Textur ---------- */
const tex=new Uint8Array(TX*TX),cv=document.createElement('canvas');cv.width=cv.height=TX;const cx=cv.getContext('2d'),T=new THREE.CanvasTexture(cv);
T.colorSpace=THREE.SRGBColorSpace;T.magFilter=THREE.NearestFilter;T.minFilter=THREE.NearestFilter;T.generateMipmaps=false;
function defaults(){tex.fill(6);const fill=(k,c,y0,y1)=>{const [x,y,w,h]=RECT[k];for(let j=y0==null?0:y0;j<(y1==null?h:y1);j++)for(let i=0;i<w;i++)tex[(y+j)*TX+x+i]=c};
  fill('head',4);fill('torso',8);fill('torso',4,16,20);['armL','armR'].forEach(k=>{fill(k,8,0,12);fill(k,4,12,24)});['legL','legR'].forEach(k=>fill(k,9));['footL','footR'].forEach(k=>fill(k,6));fill('cap',6);
  const set=(k,i,j,c)=>{const [x,y]=RECT[k];tex[(y+j)*TX+x+i]=c};set('head',10,8,9);set('head',13,8,9);set('head',11,11,10);set('head',12,11,10);
  const [x,y]=RECT.torso;for(let i=0;i<32;i++)tex[(y+8)*TX+x+i]=10}
function render(){const im=cx.createImageData(TX,TX);const h=PAL.map(p=>[parseInt(p.slice(1,3),16),parseInt(p.slice(3,5),16),parseInt(p.slice(5,7),16)]);for(let i=0;i<TX*TX;i++){const q=h[tex[i]];im.data[i*4]=q[0];im.data[i*4+1]=q[1];im.data[i*4+2]=q[2];im.data[i*4+3]=255}
  cx.putImageData(im,0,0);T.needsUpdate=true;const a=$('atlas').getContext('2d');a.imageSmoothingEnabled=false;a.drawImage(cv,0,0)}
/* ---------- Szene ---------- */
const vw=$('view'),R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});vw.appendChild(R.domElement);R.setPixelRatio(Math.min(2,devicePixelRatio));R.outputColorSpace=THREE.SRGBColorSpace;
const sc=new THREE.Scene();sc.background=new THREE.Color('#2a2442');const cam=new THREE.PerspectiveCamera(36,1,.1,50);let dist=7.4,yaw=-.6,camY=1.45;
sc.add(new THREE.HemisphereLight('#ffffff','#9a8fc0',1.7));const dl=new THREE.DirectionalLight('#ffffff',1.5);dl.position.set(3,6,4);sc.add(dl);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,40),new THREE.MeshBasicMaterial({color:'#3a3258'}));floor.rotation.x=-Math.PI/2;sc.add(floor);
const mat=new THREE.MeshStandardMaterial({map:T,roughness:1,metalness:0,flatShading:true});
const mesh=new THREE.SkinnedMesh(geo,mat);mesh.frustumCulled=false;const av=new THREE.Group();av.add(mesh);mesh.add(hips);av.scale.setScalar(1.35);sc.add(av);
av.updateMatrixWorld(true);mesh.bind(new THREE.Skeleton(bones));
const board=new THREE.Group();{const m=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.7,flatShading:true});const d=new THREE.Mesh(new THREE.BoxGeometry(.42,.035,1.55),m('#2499bb'));d.position.y=.17;board.add(d);
  [[-.19,.55],[.19,.55],[-.19,-.55],[.19,-.55]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.05,10),m('#eae8e8'));w.rotation.z=Math.PI/2;w.position.set(x,.075,z);board.add(w)})}
av.add(board);
/* ---------- Posen (gleiche Werte wie der Rund-Modus) ---------- */
let pose='stand',tPose=0;
function reset(){bones.forEach(b=>b.rotation.set(0,0,0));hips.position.set(0,.135,0);[-1,1].forEach((s,i)=>thigh[i].position.set(s*.11,.9,0))}
function applyPose(t){reset();board.visible=pose==='skate';const base=.135;
  const set=(i,th,sh)=>{thigh[i].rotation.x=th;shin[i].rotation.x=sh;foot[i].rotation.x=-(th+sh)};
  const arms=(l,r,el)=>{[l,r].forEach((x,i)=>{shoulder[i].rotation.set(x,0,(i?1:-1)*.12);elbow[i].rotation.set(el,0,(i?1:-1)*.05)})};

  else if(pose==='walk'){const ph=t*2*Math.PI*1.05,a0=Math.sin(ph),a1=-a0,f=x=>.12+.8*Math.max(0,x);hips.position.y=base+.025*Math.cos(2*ph)-.03;set(0,-.5*a0,f(Math.cos(ph)));set(1,-.5*a1,f(-Math.cos(ph)));torso.rotation.set(.1,.12*a0,0);head.rotation.x=-.08;arms(.5*a0,-.5*a0,-.25)}
  else{hips.position.y=.19;[[.8,1,.3],[.62,1,-.32]].forEach(([aa,bb,zo],i)=>{thigh[i].position.z=zo;set(i,-aa,bb);foot[i].rotation.x=aa-bb});torso.rotation.x=.3;head.rotation.x=-.25;
    [-1,1].forEach((s,i)=>{shoulder[i].rotation.set(-.25,0,s*.8);elbow[i].rotation.set(-.5,0,s*.3)})}}
function resize(){const b=vw.getBoundingClientRect();R.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}addEventListener('resize',resize);
(function loop(){tPose=performance.now()/1000;if(pose==='walk')applyPose(tPose);cam.position.set(Math.sin(yaw)*dist,camY+1.1,Math.cos(yaw)*dist);cam.lookAt(0,camY,0);av.rotation.y=0;R.render(sc,cam);requestAnimationFrame(loop)})();
/* ---------- Malen ---------- */
const S={tool:'pencil',col:8,mir:true,undo:[]};
const snap=()=>{S.undo.push(tex.slice());if(S.undo.length>60)S.undo.shift()};
function put(x,y,c){if(x<0||y<0||x>=TX||y>=TX)return;const id=reg[y*TX+x];if(!id)return;tex[y*TX+x]=c;
  if(!S.mir)return;const k=NAME_OF[id],[rx,ry,rw]=RECT[k];
  if(SELF[k]){const x2=rx+(rw-1-(x-rx));tex[y*TX+x2]=c}else if(PAIR[k]){const o=RECT[PAIR[k]];tex[(o[1]+(y-ry))*TX+o[0]+(x-rx)]=c}}

/* auf der abgewickelten Fläche */
const at=$('atlas');let pd=null;const px=e=>{const b=at.getBoundingClientRect();return [Math.floor((e.clientX-b.left)/b.width*TX),Math.floor((e.clientY-b.top)/b.height*TX)]};
at.onpointerdown=e=>{e.preventDefault();at.setPointerCapture(e.pointerId);pd='a';snap();const [x,y]=px(e);apply(x,y)};
at.onpointermove=e=>{if(pd!=='a'||S.tool==='fill'||S.tool==='pick')return;const [x,y]=px(e);apply(x,y)};
at.onpointerup=()=>{pd=null};
/* auf der Figur: Ziehen malt, daneben oder rechte Taste dreht */
const rc=new THREE.Raycaster();let drag=null;const cvs=R.domElement;
function hit(e){const b=cvs.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height*2-1)),cam);av.updateMatrixWorld(true);mesh.computeBoundingSphere();
  const h=rc.intersectObject(mesh,false)[0];return h&&h.uv?[Math.floor(h.uv.x*TX),Math.floor((1-h.uv.y)*TX)]:null}

cvs.onpointermove=e=>{if(!drag)return;if(drag.m==='paint'){if(S.tool!=='pencil')return;const h=hit(e);if(h)apply(h[0],h[1])}else{yaw=drag.yaw-(e.clientX-drag.x)*.01;camY=Math.max(.6,Math.min(2.2,drag.camY+(e.clientY-drag.y)*.005))}};

/* ---------- Oberfläche ---------- */
const TOOLS=[['pencil','Stift'],['fill','Füllen'],['pick','Pipette']];
function ui(){const t=$('tools');t.innerHTML='';TOOLS.forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',String(S.tool===k));b.onclick=()=>{S.tool=k;ui()};t.appendChild(b)});
  const p=$('pal');p.innerHTML='';PAL.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Farbe '+(i+1));b.setAttribute('aria-pressed',String(S.col===i));b.onclick=()=>{S.col=i;ui()};p.appendChild(b)})}
function overlay(){const o=$('ov').getContext('2d'),k=6;o.clearRect(0,0,384,384);o.lineWidth=1;o.strokeStyle='rgba(255,255,255,.55)';o.fillStyle='rgba(255,255,255,.8)';o.font='9px sans-serif';
  const lab={head:'Kopf',torso:'Rumpf',cap:'Kappen',armL:'Arm L',armR:'Arm R',legL:'Bein L',legR:'Bein R',footL:'Fuß L',footR:'Fuß R'};
  for(const n in RECT){const [x,y,w,h]=RECT[n];o.strokeRect(x*k+.5,y*k+.5,w*k-1,h*k-1);o.fillText(lab[n],x*k+3,y*k+10)}}
$('mir').onchange=e=>{S.mir=e.target.checked};
$('undo').onclick=()=>{const u=S.undo.pop();if(u){tex.set(u);render()}};$('reset').onclick=()=>{snap();defaults();render();msg('Zurückgesetzt.')};
$('pose').onchange=e=>{pose=e.target.value;applyPose(tPose)};
$('wire').onchange=e=>{mat.wireframe=e.target.checked};
$('smooth').onchange=e=>{const on=e.target.checked;T.magFilter=on?THREE.LinearFilter:THREE.NearestFilter;T.minFilter=on?THREE.LinearFilter:THREE.NearestFilter;T.needsUpdate=true};
const msg=t=>{$('msg').textContent=t};
/* ---------- Datensatz ---------- */
let name='Mesh';
function toObj(n){return {v:1,kind:'mesh',species:'humanoid',name:(n||name||'Mesh').slice(0,40),pal:'bau12',tex:Array.from(tex,x=>CH[x]).join('')}}
function fromObj(o){if(!o||o.v!==1||o.kind!=='mesh')throw new Error('Unbekanntes Format');if(typeof o.tex!=='string'||!/^[0-9ab]{4096}$/.test(o.tex))throw new Error('Textur ungültig (4096 Zeichen aus 0-9, a, b)');
  snap();for(let i=0;i<TX*TX;i++)tex[i]=CH.indexOf(o.tex[i]);name=String(o.name||'Mesh').slice(0,40);render()}
$('export').onclick=()=>{$('json').value=JSON.stringify(toObj());msg('Datensatz unten, zum Kopieren ('+JSON.stringify(toObj()).length+' Zeichen).')};
$('import').onclick=()=>{try{fromObj(JSON.parse($('json').value));msg('Übernommen.')}catch(e){msg('Das hat nicht geklappt: '+e.message)}};
EntwurfSrv($('srv'),'mesh',{get:n=>toObj(n),set:o=>fromObj(o)});
$('stat').textContent=(IX.length/3)+' Dreiecke, '+bones.length+' Knochen, Textur '+TX+' × '+TX+', '+PAL.length+' Farben.';
defaults();ui();overlay();render();resize();applyPose(0);
window.__msh={THREE,tex,reg,RECT,put,floodFill,apply,hit,toObj,fromObj,S,get pose(){return pose},setPose:p=>{pose=p;$('pose').value=p;applyPose(tPose)},mesh,bones,tris:IX.length/3,verts:P.length/3,defaults,render,PAL,get dist(){return dist},get cam(){return cam},get av(){return av},ready:true};
</script></body></html>
