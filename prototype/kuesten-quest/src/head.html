<title>Küsten-Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vollbild-Canvas, darüber HUD-Karten. Eine feste visuelle Welt, daher ein Look für beide Themes. */
:root{
  --ink:#1a1626;          /* Nachtviolett */
  --ink-2:#2b2540;
  --paper:#fff3e2;        /* warmes Papier für Text auf Karten */
  --pink:#d54291;
  --gold:#f0cf36;
  --cyan:#1cafd1;
  --haze:#b7a9d6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--display);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box}
.panel{background:rgba(26,22,38,.84);border:2px solid #0e0b18;border-radius:14px;box-shadow:0 4px 0 #0e0b18;padding:10px 14px}
#quest{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));min-width:210px;max-width:min(300px,60vw)}
#quest .k{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
#quest .t{font-weight:800;font-size:20px;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
#pips{display:flex;gap:6px}
#pips i{width:22px;height:22px;border-radius:50%;border:2px solid var(--haze);background:transparent;transition:transform .2s,background .2s}
#pips i.on{background:var(--gold);border-color:#7a5a00;transform:scale(1.12)}
#modes{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px - 300px);pointer-events:auto}
#modes button{font:500 12px/1 var(--mono);color:var(--paper);background:rgba(26,22,38,.84);border:2px solid #0e0b18;border-radius:10px;padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 #0e0b18}
#modes button[aria-pressed="true"]{background:var(--pink);box-shadow:0 3px 0 #7a1650}
#modes button:focus-visible,.btn:focus-visible,#av button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#track{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(36vw,380px);display:none}
#track.on{display:block}
#track .bar{position:relative;height:12px;border-radius:8px;background:#0e0b18;border:2px solid #0e0b18;outline:2px solid var(--haze);outline-offset:-2px}
#track b{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid #0e0b18;font:800 11px/16px var(--display);text-align:center;color:#0e0b18}
#mk-p{background:var(--cyan)}#mk-d{background:var(--gold)}#mk-g{background:var(--pink);color:#fff}
#track .lbl{display:flex;justify-content:space-between;font:500 11px/1 var(--mono);color:var(--haze);margin-top:8px;letter-spacing:.06em}
#track .lbl span.danger{color:var(--pink);font-weight:500}
#narr{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100vw - 32px));display:none;min-height:56px}
#narr.on{display:block}
#narr .who{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--haze);color:#0e0b18;margin-bottom:6px}
#narr .who.v{background:var(--gold)}#narr .who.d{background:var(--pink);color:#fff}
#narr p{margin:0;font:400 15px/1.45 var(--mono);color:var(--paper);min-height:1.45em}
#toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(34px,7vw,76px);line-height:1;text-align:center;color:var(--gold);text-shadow:0 4px 0 #0e0b18,0 0 0 #0e0b18;-webkit-text-stroke:2px #0e0b18;paint-order:stroke fill;opacity:0;transition:opacity .25s;pointer-events:none;text-wrap:balance;max-width:90vw}
#toast.on{opacity:1}
#np{position:absolute;right:16px;top:72px;text-align:right;max-width:min(92vw,460px);padding:8px 12px;border-radius:12px;background:rgba(14,11,24,.8);color:#fff;font-size:12px;line-height:1.4;opacity:0;transition:opacity .6s;pointer-events:none}
#np.on{opacity:1}
#np b{color:var(--gold);font-size:14px}
#touch{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
#touch.on{display:flex}
#touch .grp{display:flex;gap:12px;pointer-events:auto}
#touch button{width:62px;height:62px;border-radius:50%;border:3px solid #0e0b18;background:rgba(26,22,38,.7);color:var(--paper);font:800 22px/1 var(--display);box-shadow:0 4px 0 #0e0b18;touch-action:none}
#touch button.on{background:var(--pink)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(26,22,38,.35),rgba(26,22,38,.86));overflow:auto;padding:18px}
#overlay[hidden]{display:none!important}
.card{width:min(560px,100%);background:var(--ink);border:3px solid #0e0b18;border-radius:20px;box-shadow:0 8px 0 #0e0b18;padding:24px 26px 26px;box-sizing:border-box}
.card h1{margin:0;font-weight:800;font-size:clamp(36px,8vw,56px);line-height:.95;letter-spacing:-.01em;color:var(--gold);text-shadow:0 3px 0 #0e0b18;text-wrap:balance}
.card .sub{margin:10px 0 0;font:400 14px/1.5 var(--mono);color:var(--haze);max-width:46ch}
.card h2{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--haze);margin:22px 0 10px}
#av{display:flex;gap:10px;flex-wrap:wrap}
#av button{flex:1 1 74px;min-width:0;font:700 15px/1 var(--display);padding:12px 8px;border-radius:12px;border:3px solid #0e0b18;color:#0e0b18;cursor:pointer;box-shadow:0 4px 0 #0e0b18}
#av button[aria-pressed="true"]{outline:3px solid var(--paper);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:400 13px/1.4 var(--mono);color:var(--paper)}
.keys kbd{font:500 12px/1 var(--mono);background:var(--ink-2);border:2px solid #0e0b18;border-radius:6px;padding:3px 7px;color:var(--gold);justify-self:start;white-space:nowrap}
.btn{margin-top:22px;width:100%;font:800 22px/1 var(--display);padding:15px 18px;border-radius:14px;border:3px solid #0e0b18;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 #7a1650;-webkit-text-stroke:0}
.btn.sec{background:var(--ink-2);box-shadow:0 5px 0 #0e0b18;margin-top:12px;font-size:17px;padding:12px 16px;color:var(--paper)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a1650}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin:18px 0 0}
.stats div{background:var(--ink-2);border-radius:12px;padding:10px 12px}
.stats .n{font-weight:800;font-size:28px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.stats .l{font:400 11px/1.3 var(--mono);color:var(--haze);margin-top:4px}
.badge{margin-top:16px;display:flex;gap:10px;align-items:center;background:var(--ink-2);border-radius:12px;padding:10px 12px;font:400 13px/1.4 var(--mono)}
.badge i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2px solid #0e0b18;display:grid;place-items:center;font-style:normal;font-weight:800;color:#0e0b18}
.note{margin:16px 0 0;font:400 12px/1.5 var(--mono);color:var(--haze)}
#boom{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(213,66,145,.0),rgba(213,66,145,.5))}
#boom.on{display:flex}
#boom .big{font-weight:800;font-size:clamp(40px,10vw,96px);line-height:.95;color:var(--paper);text-shadow:0 5px 0 #0e0b18;-webkit-text-stroke:2px #0e0b18;paint-order:stroke fill}
#boom .small{background:rgba(26,22,38,.9);border:2px solid #0e0b18;border-radius:12px;padding:10px 14px;max-width:min(520px,90vw);font:400 13px/1.45 var(--mono)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--haze);font:500 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;z-index:5}
@media (min-width:900px){#overlay{justify-content:flex-start;padding-left:max(5vw,24px)}}
@media (pointer:coarse){#narr{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
#throw{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:10px;padding:8px 12px}
#throw.on{display:flex}
#throw .k{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
#throw b{font:800 15px/1 var(--display);color:var(--gold);min-width:5.2em}
#throw i{display:block;width:70px;height:8px;border-radius:5px;background:#0e0b18;position:relative;overflow:hidden}
#throw i::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,1));background:var(--gold)}
#throw.cd b{color:var(--pink)}
@media (pointer:coarse){#throw{bottom:auto;top:calc(92px + env(safe-area-inset-top,0px))}}
@media (max-width:900px){#narr{bottom:calc(18px + 52px + env(safe-area-inset-bottom,0px))}}
#radar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:112px;display:none;align-items:center;gap:10px;padding:8px 12px}
#radar.on{display:flex}
#radar .k{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
#radar b{font:800 15px/1 var(--display);min-width:4.4em;color:var(--cyan)}
#radar b[data-t="l"]{color:var(--haze)}#radar b[data-t="w"]{color:var(--gold)}#radar b[data-t="h"]{color:var(--pink)}
#radar i{display:block;width:70px;height:8px;border-radius:5px;background:#0e0b18;position:relative;overflow:hidden}
#radar i::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,.1));background:linear-gradient(90deg,var(--cyan),var(--gold),var(--pink))}
#mini{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;width:150px;height:150px;display:none;border:2px solid #0e0b18;border-radius:12px;box-shadow:0 4px 0 #0e0b18;background:#1a1626}
#mini.on{display:block}
@media (max-width:560px){#mini{width:104px;height:104px;top:58px}#radar{top:104px}}
#car{display:flex;align-items:center;gap:8px}
#cview{flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;gap:6px;height:228px;touch-action:pan-y;cursor:grab}
#cview .slot{position:relative;display:grid;place-items:center;border-radius:16px;border:3px solid #0e0b18;overflow:hidden;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c,#d54291) 70%,#fff0f8),var(--c,#d54291) 80%);box-shadow:0 5px 0 #0e0b18}
#cview .slot img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
#cview .slot img[hidden]{display:none}
#cview .main{width:152px;height:200px;flex:none}
#cview .side{width:88px;height:116px;flex:none;opacity:.55;filter:saturate(.8);transform:translateY(-8px)}
#cview .main.pop{animation:cpop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes cpop{from{transform:scale(.88) translateY(8px)}to{transform:none}}
.cb{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid #0e0b18;background:var(--pink);color:#fff;font:800 18px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 #7a1650}
.cb:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1650}
.cb:focus-visible,#cdots button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#cinfo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px;text-align:center}
#cname{font:800 22px/1.1 var(--display);color:var(--gold)}
#ctag{font:400 12px/1.4 var(--mono);color:var(--haze)}
#cdots{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#cdots button{width:12px;height:12px;border-radius:50%;border:2px solid var(--haze);background:transparent;padding:0;cursor:pointer}
#cdots button[aria-current="true"]{background:var(--gold);border-color:#7a5a00;transform:scale(1.25)}
@media (max-width:420px){#cview .side{width:60px;height:84px}#cview .main{width:132px;height:176px}#cview{height:190px}}
#inv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(26,22,38,.72);padding:16px;overflow:auto;z-index:4}
#inv[hidden]{display:none!important}
#inv .card{width:min(680px,100%);max-height:100%;overflow:auto}
#inv h1{font-size:clamp(30px,6vw,44px)}#inv h1 small{font:500 14px/1 var(--mono);color:var(--haze);letter-spacing:.08em;margin-left:8px}
#inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
.slot-i{background:var(--ink-2);border:2px solid #0e0b18;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.slot-i.got{border-color:#7a5a00;box-shadow:inset 0 0 0 1px rgba(240,207,54,.25)}
.slot-i .ic{height:62px;display:grid;place-items:center;border-radius:10px;background:#1a1626}
.slot-i .ic img{height:56px;width:56px}.slot-i .ic.q{font:800 30px/1 var(--display);color:var(--haze)}
.slot-i .sk{display:block;width:44px;height:10px;border-radius:5px;background:#2499bb;border:2px solid #0e0b18;box-shadow:inset 0 0 0 2px #f0cf36}
.slot-i b{font:800 15px/1.2 var(--display);color:var(--gold)}.slot-i:not(.got) b{color:var(--haze)}
.slot-i span{font:400 12px/1.4 var(--mono);color:var(--paper)}.slot-i:not(.got) span{color:var(--haze)}
.slot-i em{font:500 11px/1.4 var(--mono);color:var(--cyan);font-style:normal}
.invbtn{display:flex;gap:10px;flex-wrap:wrap}.invbtn .btn{flex:1 1 160px;margin-top:18px;font-size:17px;padding:12px 16px}
#b-inv-n{color:var(--gold);margin-left:4px}
#act{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--pink);color:#fff;border:3px solid #0e0b18;border-radius:14px;box-shadow:0 5px 0 #7a1650;padding:10px 16px;font:800 17px/1.1 var(--display);pointer-events:auto;cursor:pointer;z-index:3;max-width:calc(100vw - 32px)}
#act[hidden]{display:none!important}
#act kbd{font:500 11px/1 var(--mono);background:#0e0b18;color:var(--gold);border-radius:6px;padding:4px 7px}
#dlg{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(700px,calc(100vw - 32px));pointer-events:auto;z-index:5}
#dlg[hidden]{display:none!important}
#dlg .panel{display:flex;flex-direction:column;gap:8px;padding:14px 16px;background:rgba(26,22,38,.96)}
#dlg .who{align-self:flex-start;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--gold);color:#0e0b18}
#dlg .who:empty{display:none}
#dlg p{margin:0;font:400 15px/1.5 var(--mono);color:var(--paper);min-height:4.5em}
#dlg .btn{align-self:flex-end;width:auto;margin:0;padding:10px 20px;font-size:17px}
#pad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(26,22,38,.78);padding:16px;overflow:auto;z-index:6}
#pad[hidden]{display:none!important}
#pad .card{width:min(420px,100%)}#pad h1{font-size:clamp(28px,6vw,40px)}
#pad-disp{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 10px}
#pad-disp i{height:40px;border-radius:8px;background:#0e0b18;border:2px solid #444764;display:grid;place-items:center;font:800 20px/1 var(--mono);color:var(--gold);font-style:normal}
#pad-disp i.f{border-color:var(--gold)}
#pad-info{margin:0 0 10px;font:400 13px/1.45 var(--mono);color:var(--paper);min-height:2.9em}#pad-info .bad{color:var(--pink);display:block}
#pad-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pad-keys button{font:800 22px/1 var(--display);padding:14px 0;border-radius:12px;border:3px solid #0e0b18;background:var(--ink-2);color:var(--paper);cursor:pointer;box-shadow:0 4px 0 #0e0b18}
#pad-keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0b18}
#pad-keys button:disabled{opacity:.4;cursor:not-allowed}
#pad-keys #pad-ok{background:var(--pink);color:#fff;box-shadow:0 4px 0 #7a1650}
#pad.shake .card{animation:padshake .35s}
@keyframes padshake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.slot-i .dg{color:var(--gold)!important;font-weight:500}
#cd{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 14px}
#cd[hidden]{display:none!important}
#cd .k{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
#cd b{font:800 24px/1 var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
#cd.low b{color:var(--pink)}
#puz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(26,22,38,.8);padding:16px;overflow:auto;z-index:6}
#puz[hidden]{display:none!important}
#puz .card{width:min(520px,100%);max-height:100%;overflow:auto}#puz h1{font-size:clamp(28px,6vw,40px)}
#puz-b{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.cipher{font:800 clamp(20px,5vw,28px)/1.3 var(--mono);letter-spacing:.06em;background:#0e0b18;border:2px solid #444764;border-radius:10px;padding:12px 14px;color:var(--haze);word-break:break-word}
.cipher.plain{color:var(--gold);border-color:var(--gold)}
.shift{display:flex;align-items:center;justify-content:center;gap:14px;font:500 14px/1 var(--mono);color:var(--paper)}
.shift button{width:46px;height:46px;border-radius:50%;border:3px solid #0e0b18;background:var(--pink);color:#fff;font:800 22px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 #7a1650}
.shift b{color:var(--gold);font-size:20px}
.tip{margin:0;font:400 12px/1.5 var(--mono);color:var(--haze)}.tip .bad,.bad{color:var(--pink)}
.logic{font:800 clamp(16px,4vw,20px)/1.4 var(--mono);color:var(--cyan);background:#0e0b18;border-radius:10px;padding:12px 14px;text-align:center}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw button{font:800 16px/1 var(--mono);padding:16px 6px;border-radius:12px;border:3px solid #0e0b18;background:#444764;color:var(--paper);cursor:pointer;box-shadow:0 4px 0 #0e0b18}
.sw button.on{background:var(--gold);color:#0e0b18}
.alarm{font:800 20px/1 var(--mono);text-align:center;padding:10px;border-radius:10px}.alarm.bad{background:#5a1230;color:#ff9fb8}.alarm.good{background:#124a32;color:#7be0a0}
.cam{font:500 12px/1 var(--mono);color:var(--haze);text-align:center;letter-spacing:.1em;text-transform:uppercase}
.pinD{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pinD i{height:54px;border-radius:10px;background:#0e0b18;border:2px solid #444764;display:grid;place-items:center;font:800 28px/1 var(--mono);color:var(--gold);font-style:normal}
