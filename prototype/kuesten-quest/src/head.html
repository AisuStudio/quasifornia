<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Küsten-Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Vollbild-Canvas, darüber HUD-Karten. Eine feste visuelle Welt, daher ein Look für beide Themes. */
:root{
  --ink:#1a1626;          /* Nachtviolett */
  --ink-2:#2b2540;
  --paper:#fff3e2;        /* warmes Papier für Text auf Karten */
  --pink:#d54291;
  --gold:#f0cf36;
  --cyan:#1cafd1;
  --haze:#b7a9d6;
  --display:"Smarta Nova","Trebuchet MS",system-ui,sans-serif;
  --mono:"Smarta Nova","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--display);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box}
.panel{background:rgba(26,22,38,.84);border:2px solid #0e0b18;border-radius:14px;box-shadow:0 4px 0 #0e0b18;padding:10px 14px}
#quest{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));min-width:210px;max-width:min(300px,60vw)}
#quest .k{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
#quest .t{font-weight:800;font-size:20px;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
#pips{display:flex;gap:6px}
#pips i{width:22px;height:22px;border-radius:50%;border:2px solid var(--haze);background:transparent;transition:transform .2s,background .2s}
#pips i.on{background:var(--gold);border-color:#7a5a00;transform:scale(1.12)}
#modes{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px - 300px);pointer-events:auto}
#modes button{font:500 12px/1 var(--mono);color:var(--paper);background:rgba(26,22,38,.84);border:2px solid #0e0b18;border-radius:10px;padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 #0e0b18}
#modes button[aria-pressed="true"]{background:var(--pink);box-shadow:0 3px 0 #7a1650}
#modes button:focus-visible,.btn:focus-visible,#av button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#track{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(36vw,380px);display:none}
#track.on{display:block}
#track .bar{position:relative;height:12px;border-radius:8px;background:#0e0b18;border:2px solid #0e0b18;outline:2px solid var(--haze);outline-offset:-2px}
#track b{position:absolute;top:-6px;width:20px;height:20px;margin-left:-10px;border-radius:50%;border:2px solid #0e0b18;font:800 11px/16px var(--display);text-align:center;color:#0e0b18}
#mk-p{background:var(--cyan)}#mk-d{background:var(--gold)}#mk-g{background:var(--pink);color:#fff}
#track .lbl{display:flex;justify-content:space-between;font:500 11px/1 var(--mono);color:var(--haze);margin-top:8px;letter-spacing:.06em}
#track .lbl span.danger{color:var(--pink);font-weight:500}
#narr{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100vw - 32px));display:none;min-height:56px}
#narr.on{display:block}
#narr .who{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--haze);color:#0e0b18;margin-bottom:6px}
#narr .who.v{background:var(--gold)}#narr .who.d{background:var(--pink);color:#fff}
#narr p{margin:0;font:400 15px/1.45 var(--mono);color:var(--paper);min-height:1.45em}
#toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:clamp(34px,7vw,76px);line-height:1;text-align:center;color:var(--gold);text-shadow:0 4px 0 #0e0b18,0 0 0 #0e0b18;-webkit-text-stroke:2px #0e0b18;paint-order:stroke fill;opacity:0;transition:opacity .25s;pointer-events:none;text-wrap:balance;max-width:90vw}
#toast.on{opacity:1}
#sc-hud{position:relative;display:inline-flex;align-items:center;gap:7px;font:700 13px/1 var(--mono);color:var(--paper);background:rgba(26,22,38,.84);border:2px solid #0e0b18;border-radius:10px;padding:8px 11px;box-shadow:0 3px 0 #0e0b18}
#sc-hud[hidden]{display:none}
.sc{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd0e8,#ee7cb8 55%,#d54291);border:2px solid #0e0b18}
#sc-hud.pulse{animation:scp .5s ease}
@keyframes scp{40%{transform:scale(1.14);background:rgba(120,40,90,.95)}}
#sc-d{position:absolute;right:6px;top:100%;margin-top:4px;font-weight:800;opacity:0;text-decoration:none;text-shadow:0 2px 0 #0e0b18;pointer-events:none}
#sc-d.up{color:var(--gold)}#sc-d.dn{color:#ff8fa8}
#sc-d.on{animation:scd 1.1s ease forwards}
@keyframes scd{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
#inv .card{max-height:calc(100vh - 28px);overflow-y:auto}
#graf{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(14,11,24,.82);padding:12px;overflow:auto;z-index:5}
#graf[hidden]{display:none!important}
#graf .card{width:min(860px,100%);max-height:100%;overflow:auto}
#graf h1{font-size:clamp(28px,5vw,40px)}#graf h1 small{font:500 13px/1 var(--mono);color:var(--haze);letter-spacing:.08em;margin-left:8px}
#graf-cv{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated;background:#2b2840;border:3px solid #0e0b18;border-radius:10px;cursor:crosshair;touch-action:none}
#graf-pal{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.gpal{position:relative;width:46px;height:46px;border-radius:50%;border:3px solid #0e0b18;background:var(--c);cursor:pointer;overflow:hidden;padding:0}
.gpal i{position:absolute;left:0;bottom:0;height:5px;background:#0e0b18;opacity:.55}
.gpal.on{outline:3px solid var(--gold);outline-offset:2px}.gpal.empty{opacity:.35}
.grafrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grafrow button{font:600 13px/1 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:8px;padding:8px 12px;cursor:pointer}.grafrow button.on{background:var(--pink)}
#rp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
#rp-tabs button{font:500 12px/1 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:10px;padding:8px 11px;cursor:pointer}
#rp-tabs button[aria-pressed="true"]{background:var(--pink)}
#rp-tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.aulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.au{background:var(--ink-2);border:2px solid #0e0b18;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.au.done{border-color:#2f7a55}
.au .zl{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.au em{font-style:normal;font-size:12px;color:var(--haze)}.au .rw{font:600 12px/1.3 var(--mono);color:var(--paper)}
.bal{display:flex;align-items:center;gap:10px;font:800 40px/1 var(--display);margin:4px 0 8px}.bal .sc{width:28px;height:28px}.bal span{font:600 14px/1 var(--mono);color:var(--haze)}
.prices{display:flex;justify-content:space-between;background:var(--ink-2);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.lg{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-bottom:6px}.lg div{display:flex;justify-content:space-between;gap:12px}
.lg .up{color:var(--gold)}.lg .dn{color:#ff8fa8}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.sk{background:var(--ink-2);border:2px solid #0e0b18;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px}.sk.on{border-color:var(--gold)}.sk i{display:block;height:20px;border-radius:8px;border:2px solid #0e0b18}.sk button{font:600 12px/1 var(--mono);color:var(--paper);background:var(--pink);border:2px solid #0e0b18;border-radius:8px;padding:7px;cursor:pointer}.sk button:disabled{opacity:.45;cursor:default}
.edwrap{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:14px;align-items:start}.edprev{position:sticky;top:0;border-radius:14px;background:#1a1626;border:2px solid #0e0b18;overflow:hidden;text-align:center}.edprev img{display:block;width:100%;aspect-ratio:360/470;object-fit:cover}.edprev b{display:block;padding:7px;font:700 13px/1 var(--mono);color:var(--gold)}.swrow{display:flex;gap:7px;flex-wrap:wrap}.swb{position:relative;width:34px;height:34px;border-radius:50%;border:3px solid #0e0b18;cursor:pointer;color:var(--paper);font:700 14px/1 var(--mono);background:var(--ink-2);padding:0}.swb.on{outline:3px solid var(--gold);outline-offset:2px}.swb.lock{opacity:.78}.swb small{position:absolute;right:-5px;bottom:-5px;background:#0e0b18;border-radius:8px;padding:2px 4px;font-size:10px}.swb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media (max-width:640px){.edwrap{grid-template-columns:1fr}.edprev{position:static;max-width:220px}}.edh{font:700 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
.plr{display:flex;align-items:center;gap:14px;margin:12px 0;flex-wrap:wrap}.plbtn{width:58px;height:58px;border-radius:50%;border:3px solid #0e0b18;background:var(--pink);color:#fff;font:800 20px/1 var(--display);cursor:pointer;box-shadow:0 4px 0 #0e0b18}.plbtn:focus-visible,.plsfx:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.plvol{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px;font:500 12px/1 var(--mono);color:var(--haze)}.plvol input{width:100%;accent-color:#d54291}.plsfx{font:600 13px/1.2 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:10px;padding:10px 14px;cursor:pointer}.plsfx[aria-pressed="true"]{background:#2f7a55}
#rp-ter{display:flex;flex-direction:column;gap:8px}
#term-log{height:230px;overflow-y:auto;background:#0e0b18;border:2px solid #0e0b18;border-radius:12px;padding:10px 12px;font:400 13px/1.45 var(--mono);color:var(--paper);word-break:break-word}
#term-log .tl-sys{color:var(--gold)}#term-log .tl-cmd{color:#7de0a8}#term-log .tl-me b{color:var(--pink)}#term-log .tl-in b{color:#8fd0ff}
#term-in{font:500 14px/1 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:10px;padding:11px 12px}#term-in:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#chathud{position:absolute;left:16px;bottom:18px;max-width:380px;display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:3;font:500 13px/1.35 var(--mono);color:#fff}
#chathud div{background:rgba(26,22,38,.88);border:2px solid #0e0b18;border-radius:10px;padding:6px 9px;word-break:break-word}#chathud b{color:#8fd0ff}
#bld{position:absolute;left:14px;top:14px;bottom:14px;width:250px;overflow-y:auto;background:rgba(26,22,38,.94);border:3px solid #0e0b18;border-radius:16px;padding:12px 12px 14px;color:var(--paper);font:500 12.5px/1.35 var(--mono);box-shadow:0 5px 0 #0e0b18;pointer-events:auto;z-index:5;display:flex;flex-direction:column;gap:10px}
#bld[hidden]{display:none}#bld h2{margin:0;font:800 20px var(--display,'Smarta Nova'),sans-serif;color:var(--gold)}
#bld-tabs,#bld-parts,#bld-tools{display:flex;flex-wrap:wrap;gap:6px}#bld-cols{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#bld button{font:500 12px/1.1 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:9px;padding:7px 9px;cursor:pointer}
#bld button[aria-pressed="true"]{background:var(--pink)}#bld-parts button{display:flex;align-items:center;gap:6px}#bld-parts i{width:12px;height:12px;border-radius:3px;border:2px solid #0e0b18;display:inline-block}
#bld-cols button{height:26px;padding:0;border-radius:8px}#bld-cols button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:1px}
#bld-req{display:flex;flex-direction:column;gap:3px;background:var(--ink-2);border-radius:10px;padding:8px 10px}#bld-req .ok{color:#7de0a8}#bld-hint{margin:0;opacity:.75;font-size:11.5px}#bld-end{display:flex;gap:8px;margin-top:auto}#bld-end .btn{flex:1}
.trk{display:flex;flex-direction:column;gap:6px;margin:8px 0}.trk button{text-align:left;font:500 13px/1.2 var(--mono);color:var(--paper);background:var(--ink-2);border:2px solid #0e0b18;border-radius:10px;padding:8px 11px;cursor:pointer}.trk button[aria-pressed="true"]{background:var(--pink)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0}.dk{display:flex;flex-direction:column;gap:5px;align-items:stretch;background:var(--ink-2);border:2px solid #0e0b18;border-radius:12px;padding:6px;cursor:pointer;color:var(--paper);font:500 11.5px/1.2 var(--mono);text-align:center}.dk img{width:100%;height:120px;object-fit:contain;background:#0e0b18;border-radius:8px}.dk[aria-pressed="true"]{background:var(--pink)}
.np2{display:flex;flex-direction:column;gap:4px;background:var(--ink-2);border-radius:14px;padding:12px 14px;font-size:14px}.np2 b{color:var(--gold);font-size:17px}
@media (prefers-reduced-motion:reduce){#sc-hud.pulse,#sc-d.on{animation:none}#sc-d.on{opacity:1}}

#np{position:absolute;right:16px;top:72px;text-align:right;max-width:min(92vw,460px);padding:8px 12px;border-radius:12px;background:rgba(14,11,24,.8);color:#fff;font-size:12px;line-height:1.4;opacity:0;transition:opacity .6s;pointer-events:none}
#np.on{opacity:1}
#np b{color:var(--gold);font-size:14px}
#touch{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
#touch.on{display:flex}
#touch .grp{display:flex;gap:8px;pointer-events:auto}
#touch button{width:54px;height:54px;border-radius:50%;border:3px solid #0e0b18;background:rgba(26,22,38,.7);color:var(--paper);font:800 22px/1 var(--display);box-shadow:0 4px 0 #0e0b18;touch-action:none}
#touch button.on{background:var(--pink)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(26,22,38,.35),rgba(26,22,38,.86));overflow:auto;padding:18px}
#overlay[hidden]{display:none!important}
.card{width:min(560px,100%);background:var(--ink);border:3px solid #0e0b18;border-radius:20px;box-shadow:0 8px 0 #0e0b18;padding:24px 26px 26px;box-sizing:border-box}
.card h1{margin:0;font-weight:800;font-size:clamp(36px,8vw,56px);line-height:.95;letter-spacing:-.01em;color:var(--gold);text-shadow:0 3px 0 #0e0b18;text-wrap:balance}
.card .sub{margin:10px 0 0;font:400 14px/1.5 var(--mono);color:var(--haze);max-width:46ch}
.card h2{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--haze);margin:22px 0 10px}
#av{display:flex;gap:10px;flex-wrap:wrap}
#av button{flex:1 1 74px;min-width:0;font:700 15px/1 var(--display);padding:12px 8px;border-radius:12px;border:3px solid #0e0b18;color:#0e0b18;cursor:pointer;box-shadow:0 4px 0 #0e0b18}
#av button[aria-pressed="true"]{outline:3px solid var(--paper);outline-offset:2px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:400 13px/1.4 var(--mono);color:var(--paper)}
.keys kbd{font:500 12px/1 var(--mono);background:var(--ink-2);border:2px solid #0e0b18;border-radius:6px;padding:3px 7px;color:var(--gold);justify-self:start;white-space:nowrap}
.btn{margin-top:22px;width:100%;font:800 22px/1 var(--display);padding:15px 18px;border-radius:14px;border:3px solid #0e0b18;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 #7a1650;-webkit-text-stroke:0}
.btn.sec{background:var(--ink-2);box-shadow:0 5px 0 #0e0b18;margin-top:12px;font-size:17px;padding:12px 16px;color:var(--paper)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a1650}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;margin:18px 0 0}

.badge i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2px solid #0e0b18;display:grid;place-items:center;font-style:normal;font-weight:800;color:#0e0b18}
.note{margin:16px 0 0;font:400 12px/1.5 var(--mono);color:var(--haze)}

#boom .small{background:rgba(26,22,38,.9);border:2px solid #0e0b18;border-radius:12px;padding:10px 14px;max-width:min(520px,90vw);font:400 13px/1.45 var(--mono)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);color:var(--haze);font:500 13px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;z-index:5}

#card{max-height:calc(100dvh - 36px);overflow:auto}

#overlay.opening{justify-content:center;padding-left:18px}
.logo{display:flex;justify-content:flex-start;margin:0 0 4px}.logo-svg{display:block;height:104px;width:auto;max-width:100%;}h1.gt{font-size:16px!important;letter-spacing:.14em;text-transform:uppercase;color:var(--haze)!important;margin:0 0 6px!important;font-weight:700}
