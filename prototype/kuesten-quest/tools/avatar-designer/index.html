<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar-Designer (intern, Prototyp)</title>
<!-- Avatar-Designer v0: internes Werkzeug, noch nicht Teil des Spiels.
     Kern: ein Datensatz aus TEILEN (Netz mit festen Pixeln), Zonenfarben (Palette), Malen mit Spiegelung und Aufklebern (Decals), dazu Regler für die Körperform.
     Der Avatar ist die erste Art ("humanoid"). Weitere Arten (insectoid, reptiloid, canid), Tiere, Werkzeuge und Fahrzeuge folgen als weitere Teile-Sätze, siehe README.md.
     Starten: im Ordner prototype/kuesten-quest einen Webserver starten (python3 -m http.server 8080) und /tools/avatar-designer/ öffnen. -->
<style>

.sub{color:var(--mu);font-size:13px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}

button{cursor:pointer}button.on{background:var(--ac);color:#1a1626;border-color:var(--ac)}

<div id="app"><div id="view"><div id="hint">Ziehen: drehen · Teile unten rechts wählen · Malen im Netz</div></div>
<div id="side">
<h1>Avatar-Designer</h1><p class="sub">Intern · Prototyp v0 · Art: Humanoid (weitere Arten folgen)</p>
<h2>Teil</h2><div class="row" id="parts"></div>
<h2>Netz (jedes Pixel ist ein Pixel am Körper)</h2>

<div class="row"><label for="decal">Aufkleber:</label><select id="decal"></select><button id="undo">Zurück</button><button id="clear">Teil leeren</button></div>
<h2>Palette</h2><div id="pal"></div>
<h2>Zonen (Grundfarbe je Teil)</h2><div id="zones"></div>
<h2>Körperform</h2><div id="sliders"></div>

</div></div>
